# push / pull_request で、バックエンドとフロントエンドのチェックを並列で回す CI。
# 検索精度の評価はモデルと DB が必要なため手元で実行し、CI では指標計算のテストを pytest で走らせる。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff==0.6.9

      - name: Ruff check
        run: ruff check packages/rag-core services/rag-api tools database --output-format=github

      - name: Ruff format check
        run: ruff format --check packages/rag-core services/rag-api tools database

  backend-test:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # テストは CPU で足りるので、GPU 用のライブラリを含まない CPU 版の torch を先に入れる
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-asyncio pytest-cov coverage
          pip install -e ./packages/rag-core
          pip install -r services/rag-api/requirements.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/rag-core:${{ github.workspace }}/services/rag-api/src
        run: |
          pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend (Lint / Type Check / Test / Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/assist-chat
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./apps/assist-chat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
