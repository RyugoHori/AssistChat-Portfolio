# OCR 文字混同辞書（文脈条件付きで補正）
# "context" は補正を適用する条件を表す正規表現
ocr_corrections:
  - pattern: "0"       # 数字のゼロ
    replace: "O"       # アルファベットのオー
    context: "周辺が英字"

  - pattern: "l"       # エル小文字
    replace: "1"       # 数字の 1
    context: "周辺が数字"

  - pattern: "一"      # 漢数字の一
    replace: "ー"      # カタカナの長音
    context: "カタカナ語の直後"

  - pattern: "力"
    replace: "カ"
    context: "カタカナ語の一部"

  - pattern: "ロ"      # カタカナのロ
    replace: "口"      # 漢字の口
    context: "漢字列の中"

  - pattern: "工"      # 漢字の工
    replace: "エ"      # カタカナのエ
    context: "カタカナ語の一部"

  - pattern: "才"      # 漢字の才
    replace: "オ"      # カタカナのオ
    context: "カタカナ語の一部"

  - pattern: "二"      # 漢数字の二
    replace: "ニ"      # カタカナのニ
    context: "カタカナ語の一部"

  - pattern: "夕"      # 漢字の夕
    replace: "タ"      # カタカナのタ
    context: "カタカナ語の一部"

  - pattern: "卜"      # 漢字の卜
    replace: "ト"      # カタカナのト
    context: "カタカナ語の一部"
