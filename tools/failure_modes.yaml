  # 駆動制御
  - id: INV_OVERCURRENT
    equipment2: [インバータ]
    cause_category: 設定・プログラム
    error_code: "ALM5101"
    values:
      value: {min: 0.5, max: 0.8, unit: "秒"}
    symptoms:
      - "{eq}で過電流トリップが発生し、PLCにインバータ異常アラーム{code}が表示された。"
      - "{eq} {code} 過電流。"
      - "{eq}が動き出すときに{code}で落ちる。"
      - "{eq}が起動のときにトリップする。"
    cause: "搬送速度を上げる設定変更の際に、加速時間が{value}と短く設定され、起動時に過電流が流れていた。"
    action: "パラメータP-07（加速時間）を元の3.0秒に戻し、変更履歴を保全台帳に記録。起動時の電流が定格内であることを確認。"

