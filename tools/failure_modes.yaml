# デモデータ用の故障モード辞書（一般的なガラス加工工場を想定した架空のもの）
# generate_demo_data.py がこの辞書から、症状・原因・処置がつながった保全記録を作る。
# 実在のメーカー名・製品の型番・工場の設備名は使っていない。
# 型番は、規格で決まった呼び方だけを使う（軸受 6204ZZ・6205ZZ、チェーン RS40、Vベルト A-42、Oリング P-22）。
# エラーコードはPLCのアラーム番号（架空）。千の位で場所を分けている：
#   1xxx 切断・加工、2xxx 搬送、3xxx 炉・強化、4xxx ユーティリティ、5xxx 盤・駆動、6xxx 制御・通信

cause_categories:
  - 摩耗・劣化
  - 緩み・ズレ
  - 断線・接触不良
  - 異物・汚れ・詰まり
  - 設定・プログラム
  - 部品破損
  - 油・エア漏れ
  - ノイズ・通信

writer_styles:
  - name: 基本
    weight: 40
    replace: {}
  - name: 簡潔
    weight: 20
    prefer_short: true
    replace: {}
  - name: 長音省略
    weight: 15
    replace: {モーター: モータ, インバーター: インバータ, コンプレッサー: コンプレッサ, シリンダー: シリンダ, センサー: センサ, ローラー: ローラ, ヒーター: ヒータ}
  - name: 略称
    weight: 15
    replace: {インバータ: INV, コンベア: CV, シリンダー: CYL, ベアリング: BRG, モーター: MTR}
  - name: 全角
    weight: 10
    to_fullwidth: true
    replace: {}

modes:
  # 切断設備
  - id: CUTTER_WHEEL_WEAR
    equipment2: [切断機]
    cause_category: 摩耗・劣化
    values:
      value: {min: 0.4, max: 0.9, unit: "mm"}
    symptoms:
      - "{eq}で切断したガラスの切り口に欠けが連続して発生し、後工程の面取りで除去しきれない。"
      - "{eq} 切り口欠け多発。"
      - "{eq}で切ったガラスの端がギザギザになる。"
    cause: "カッターホイールの刃先が摩耗して丸くなっており、切り口に幅{value}の欠けが生じていた（許容0.3mm以下）。"
    action: "カッターホイールを新品に交換し、切断圧と切込み量を再調整。試し切り5枚で欠けがないことを確認。"

  - id: CUT_OIL_CLOG
    equipment2: [切断機]
    cause_category: 異物・汚れ・詰まり
    symptoms:
      - "{eq}の切断線が途中で途切れ、折割工程でガラスが切断線どおりに割れない。"
      - "{eq} 切断線切れ。"
      - "{eq}の線がところどころ入ってない。"
    cause: "カッターヘッドへ切削油を送る配管のノズルがガラス粉で詰まり、刃先に油が供給されていなかった。"
    action: "ノズルと配管を分解清掃し、切削油を交換。油の滴下量を確認し、ノズル清掃を週次点検に追加。"

  - id: CUT_PRESSURE_DROP
    equipment2: [切断機]
    cause_category: 油・エア漏れ
    error_code: "ALM1102"
    values:
      value: {min: 0.18, max: 0.24, unit: "MPa"}
    symptoms:
      - "{eq}で切断圧低下のアラーム{code}がタッチパネルに表示され、切断が途中で停止した。"
      - "{eq} {code} 切断圧低下。"
      - "{eq}が{code}出して止まる。"
      - "{eq}の切断圧が上がらず止まる。"
    cause: "カッターヘッドのエアシリンダーのパッキンが劣化してエアが漏れ、切断圧が設定0.30MPaに対し{value}まで低下していた。"
    action: "エアシリンダーのパッキンを交換し、レギュレーターで切断圧を0.30MPaに再設定。石けん水でリークがないことを確認。"

  - id: BREAK_BAR_MISALIGN
    equipment2: [折割機]
    cause_category: 緩み・ズレ
    values:
      value: {min: 1.5, max: 3.5, unit: "mm"}
    symptoms:
      - "{eq}でガラスが切断線から外れて割れ、斜めの割れ口が発生した。"
      - "{eq} 割れ不良。"
      - "{eq}で割ると変なとこから割れる。"
    cause: "割りバーの取付ボルトが緩み、割りバーの位置が切断線から{value}ずれていた。"
    action: "割りバーの位置を基準ゲージで合わせ直し、取付ボルトを規定トルクで増し締め。合いマークを付けた。"

  # 加工設備
  - id: DRILL_BIT_WEAR
    equipment2: [孔あけ機]
    cause_category: 摩耗・劣化
    values:
      value: {min: 0.6, max: 1.4, unit: "mm"}
    symptoms:
      - "{eq}であけた孔の裏側に貝殻状の欠けが発生し、検査で不良判定となった。"
      - "{eq} 孔欠け。"
      - "{eq}の孔の周りが欠ける。"
    cause: "ダイヤモンドドリルの先端が摩耗しており、孔の裏側に幅{value}の欠けが生じていた（許容0.5mm以下）。"
    action: "上下のダイヤモンドドリルを新品に交換し、上下の芯ずれをゲージで確認。交換時期を加工数で管理するようにした。"

  - id: DRILL_COOLANT_CLOG
    equipment2: [孔あけ機]
    cause_category: 異物・汚れ・詰まり
    error_code: "ALM1205"
    values:
      value: {min: 0.8, max: 1.6, unit: "L/min"}
    symptoms:
      - "{eq}で冷却水流量低下のアラーム{code}が発生し、孔あけが停止した。"
      - "{eq} {code} 冷却水。"
      - "{eq}が{code}で止まる。水が出てないっぽい。"
      - "{eq}の冷却水が出ず停止。"
    cause: "冷却水のストレーナーがガラス粉のスラッジで詰まり、流量が通常3.0L/minに対し{value}まで低下していた。"
    action: "ストレーナーを取り外して洗浄し、冷却水タンクのスラッジを除去。流量が3.0L/minに戻ったことを確認。"

  - id: GRIND_WHEEL_WEAR
    equipment2: [面取り機]
    cause_category: 摩耗・劣化
    values:
      value: {min: 1.1, max: 1.4, unit: "mm"}
    symptoms:
      - "{eq}で加工したガラスの面取り幅が規格（0.8±0.2mm）を外れ、{value}となっている。"
      - "{eq} 面取り幅NG。"
      - "{eq}の面取りが大きくなってる。"
    cause: "ダイヤモンドホイールの砥粒が摩耗して目つぶれしており、研削量の補正が追従しきれていなかった。"
    action: "ダイヤモンドホイールを交換し、ドレッシングを実施。面取り幅を測定し、0.8mmに収まることを確認。"

  - id: GRIND_WATER_SHORTAGE
    equipment2: [面取り機]
    cause_category: 異物・汚れ・詰まり
    symptoms:
      - "{eq}の研削部から焼けたにおいがし、ガラスの面取り部に焼けとカケが出た。"
      - "{eq} 研削焼け。"
      - "{eq}で焦げくさいにおいがする。"
    cause: "研削水のノズルが研削スラッジで詰まり、ホイールに研削水がかかっていなかった。"
    action: "ノズルを清掃し、研削水タンクのスラッジを回収。ノズルの向きを調整し、ホイールに当たることを確認。"

  - id: WASH_BRUSH_WEAR
    equipment2: [洗浄機]
    cause_category: 摩耗・劣化
    values:
      value: {min: 55, max: 70, unit: "%"}
    symptoms:
      - "{eq}を通したガラスの表面に汚れが残り、印刷工程で印刷ムラが発生した。"
      - "{eq} 洗浄不良。"
      - "{eq}通っても汚れが落ちてない。"
    cause: "ロールブラシの毛先が摩耗して短くなり、ガラスへの当たりが弱くなっていた（毛丈が新品時の{value}）。"
    action: "ロールブラシを上下とも新品に交換し、ガラスへの押し込み量を再調整。洗浄後の水はじきで汚れがないことを確認。"

  - id: RINSE_WATER_QUALITY
    equipment2: [洗浄機]
    cause_category: 異物・汚れ・詰まり
    values:
      value: {min: 12, max: 25, unit: "μS/cm"}
    symptoms:
      - "{eq}で乾燥した後のガラスに水ジミが出ている。"
      - "{eq} 水ジミ。"
      - "{eq}のあとガラスにシミが残る。"
    cause: "純水装置のイオン交換樹脂が飽和し、仕上げ洗浄水の導電率が{value}まで上昇していた（管理値5μS/cm以下）。"
    action: "イオン交換樹脂を再生し、導電率が管理値以下に戻ったことを確認。導電率の確認を日常点検に追加。"

  # 印刷設備
  - id: SQUEEGEE_WEAR
    equipment2: [スクリーン印刷機]
    cause_category: 摩耗・劣化
    values:
      value: {min: 0.6, max: 1.2, unit: "mm"}
    symptoms:
      - "{eq}で印刷したセラミックの縁がかすれ、印刷ムラが連続して発生した。"
      - "{eq} 印刷かすれ。"
      - "{eq}の印刷がかすれる。"
    cause: "スキージのゴムの先端が{value}摩耗して丸くなり、印圧が均一にかかっていなかった。"
    action: "スキージを新品に交換し、スキージの角度と印圧を再調整。試し刷り3枚で印刷ムラがないことを確認。"

  - id: PRINT_POSITION_OFFSET
    equipment2: [スクリーン印刷機]
    cause_category: 緩み・ズレ
    values:
      value: {min: 0.8, max: 1.5, unit: "mm"}
    symptoms:
      - "{eq}の印刷位置がガラスの外形に対して{value}ずれ、検査で位置ずれ不良となった。"
      - "{eq} 印刷位置ずれ。"
      - "{eq}の印刷が端に寄ってる。"
    cause: "ガラスの位置決めピンの取付ねじが緩み、位置決めの基準がずれていた（許容±0.5mm）。"
    action: "位置決めピンを基準治具で合わせ直し、ねじを増し締めしてマーキング。印刷位置を測定し、許容内に入ることを確認。"

  - id: DRYER_HEATER_BREAK
    equipment2: [乾燥炉]
    cause_category: 断線・接触不良
    error_code: "ALM3205"
    values:
      value: {min: 138, max: 156, unit: "℃"}
    symptoms:
      - "{eq}の温度下限アラーム{code}が表示され、炉内温度が設定180℃まで上がらない。"
      - "{eq} {code} 温度上がらず。"
      - "{eq}が{code}出てる。温度が上がらない。"
      - "{eq}の温度が{value}で頭打ちになる。"
    cause: "ヒーター（3kW）6本のうち2本が断線しており、炉内温度が{value}で頭打ちになっていた。"
    action: "断線したヒーター2本を交換し、残りのヒーターの抵抗値を測定して異常がないことを確認。昇温して180℃で安定することを確認。"

  - id: DRYER_FAN_BELT
    equipment2: [乾燥炉]
    cause_category: 摩耗・劣化
    values:
      value: {min: 70, max: 82, unit: "%"}
    symptoms:
      - "{eq}の循環ファンから異音がし、炉内の温度ムラでインクの乾燥不良が発生した。"
      - "{eq} 乾燥不良、ファン異音。"
      - "{eq}のファンがキュルキュル鳴ってて、乾きが悪い。"
    cause: "循環ファンのVベルト（A-42）が摩耗してスリップし、ファンの回転数が定格の{value}まで低下していた。"
    action: "Vベルトを新品（A-42）に交換し、テンションメーターで張力を規定値に調整。ファンの回転数と炉内の温度分布を確認。"

  # 強化設備
  - id: FURNACE_HEATER_BREAK
    equipment2: [加熱炉]
    cause_category: 断線・接触不良
    error_code: "ALM3102"
    values:
      value: {min: 632, max: 655, unit: "℃"}
    symptoms:
      - "{eq}の温度下限アラーム{code}が発生し、炉内温度が設定680℃に達しないため生産を停止した。"
      - "{eq} {code} 炉温低下。"
      - "{eq}の温度が上がらなくて{code}で止まった。"
      - "{eq}の炉温が{value}で頭打ち。"
    cause: "第3ゾーンのヒーターエレメントが断線しており、炉内温度が{value}までしか上がっていなかった。"
    action: "第3ゾーンのヒーターエレメントを交換し、全ゾーンの抵抗値を測定。昇温後、各ゾーンが設定温度で安定することを確認。"

  - id: FURNACE_SSR_FAIL
    equipment2: [加熱炉]
    cause_category: 部品破損
    values:
      value: {min: 18, max: 35, unit: "℃"}
    symptoms:
      - "{eq}の一部のゾーンだけ温度が設定より高くなり、ガラスに光学ゆがみが出た。"
      - "{eq} ゾーン温度高い。"
      - "{eq}の一か所だけ温度が上がりすぎる。"
    cause: "ヒーター制御用のSSRが内部で短絡し、出力がオンのまま切れなくなっていた（ゾーン温度が設定より{value}高い）。"
    action: "SSRを同型の予備品と交換し、放熱フィンにシリコングリスを塗り直して取り付け。温度制御が正常に戻ったことを確認。"

  - id: FURNACE_ROLLER_RUNOUT
    equipment2: [加熱炉]
    cause_category: 摩耗・劣化
    values:
      value: {min: 0.25, max: 0.45, unit: "mm"}
    symptoms:
      - "{eq}を出たガラスにロール跡のような波状のゆがみが出て、透視検査で不良になった。"
      - "{eq} ロール跡ゆがみ。"
      - "{eq}のあとガラスが波打って見える。"
    cause: "炉内の搬送用セラミックロールの一部が変形し、回転したときの振れが{value}になっていた（基準0.1mm以下）。"
    action: "変形したセラミックロールを交換し、全ロールの振れを測定。試し焼きでゆがみが基準内に収まることを確認。"

  - id: BEND_MOLD_POSITION
    equipment2: [曲げ成形機]
    cause_category: 緩み・ズレ
    values:
      value: {min: 1.2, max: 2.5, unit: "mm"}
    symptoms:
      - "{eq}で曲げたガラスの形状が検査治具に合わず、すき間が{value}出ている（許容0.8mm以下）。"
      - "{eq} 曲げ形状NG。"
      - "{eq}で曲げたやつが治具に合わない。"
    cause: "成形型の取付ボルトが熱による伸び縮みで緩み、型の位置がずれていた。"
    action: "成形型の位置を基準ピンで合わせ直し、取付ボルトを規定トルクで増し締め。試し曲げで形状が許容内に入ることを確認。"

  - id: QUENCH_PRESSURE_LOW
    equipment2: [風冷装置]
    cause_category: 異物・汚れ・詰まり
    error_code: "ALM3301"
    values:
      value: {min: 8.5, max: 10.5, unit: "kPa"}
    symptoms:
      - "{eq}の風圧低下アラーム{code}が発生し、強化不足のおそれがあるため生産を止めた。"
      - "{eq} {code} 風圧低下。"
      - "{eq}が{code}出した。風が弱いっぽい。"
      - "{eq}の風圧が上がらない。"
    cause: "ブロワの吸込みフィルターがほこりで目詰まりし、風冷圧が設定12.5kPaに対し{value}まで低下していた。"
    action: "吸込みフィルターを交換し、ブロワの吸込み口を清掃。風冷圧が設定値に戻ったことを確認し、フィルターの交換周期を見直した。"

  - id: QUENCH_DAMPER_SETTING
    equipment2: [風冷装置]
    cause_category: 設定・プログラム
    values:
      value: {min: 24, max: 36, unit: "個"}
    symptoms:
      - "抜き取りの破砕試験で、{eq}を通したガラスの破片数が基準を下回った。"
      - "破砕試験NG（{eq}）。"
      - "{eq}のあとの破砕試験で破片が少ない。"
    cause: "段取り替えのときに{eq}のダンパー開度が変更されたままになっており、冷却が弱く破片数が{value}（50mm角あたり）しかなかった（基準40個以上）。"
    action: "ダンパー開度を品種ごとの設定表どおりに戻し、破砕試験で基準を満たすことを確認。段取り替えのチェック表に開度の確認を追加。"

  # 回転部を持つ設備に共通の故障
  - id: BEARING_WEAR
    equipment2: [ローラーコンベア, ベルトコンベア, 冷却水ポンプ, 集塵機, 風冷装置]
    cause_category: 摩耗・劣化
    values:
      value: {min: 7.1, max: 11.8, unit: "mm/s"}
    symptoms:
      - "{eq}の駆動部から異音が発生し、振動値が管理基準（4.5mm/s）を超え、{value}を記録した。"
      - "{eq} 異音、振動大。"
      - "{eq}からゴロゴロ音がする。"
    cause: "モーター側のベアリング（6205ZZ）が摩耗し、回転振れが生じていた。"
    action: "ベアリング（6205ZZ）を予備品と交換し、芯出し調整を実施。振動値が管理基準内に戻ったことを確認。"

  # 空圧で動く設備に共通の故障
  - id: AIR_LEAK
    equipment2: [折割機, 曲げ成形機]
    cause_category: 油・エア漏れ
    values:
      value: {min: 0.38, max: 0.46, unit: "MPa"}
    symptoms:
      - "{eq}の供給エア圧力が{value}まで低下し、シリンダー動作が不安定になった。"
      - "{eq} エア圧低下。"
      - "{eq}のシリンダーの動きが遅い。"
    cause: "シリンダーへのエア配管の継手からエアが漏れており、供給エア圧力が設定0.50MPaより低下していた。"
    action: "継手を新品に交換し、配管を組み直した。石けん水で漏れがないことを確認し、供給エア圧力が設定値に戻ったことを確認。"

  # 搬送設備
  - id: CHAIN_ELONGATION
    equipment2: [ローラーコンベア]
    cause_category: 摩耗・劣化
    values:
      value: {min: 1.6, max: 2.4, unit: "%"}
    symptoms:
      - "{eq}の駆動部から周期的な打音が発生し、ローラーの回転が断続的に止まる。"
      - "{eq} チェーン音大。"
      - "{eq}がガタガタ鳴って、たまにガラスが止まる。"
    cause: "駆動チェーン（RS40）の伸び率が{value}に達し、スプロケットとのかみ合いが悪くなっていた（交換基準1.5%）。"
    action: "駆動チェーンとスプロケットを交換し、テンショナーで張りを調整。試運転でローラーが一定の速度で回ることを確認。"

  - id: ROLLER_RING_WEAR
    equipment2: [ローラーコンベア]
    cause_category: 摩耗・劣化
    values:
      value: {min: 1.5, max: 3, unit: "mm"}
    symptoms:
      - "{eq}上でガラスがスリップし、次工程への搬送位置ずれが発生。"
      - "{eq} スリップ、位置ずれ。"
      - "{eq}でガラスが滑ってずれる。"
    cause: "ローラーのゴムリングが摩耗して外径が{value}細くなり、ガラスとの摩擦が足りなくなっていた。"
    action: "摩耗したゴムリングを全数交換し、ローラーの高さをそろえて再調整。搬送位置が基準内に入ることを確認。"

  - id: ROLLER_OVERLOAD
